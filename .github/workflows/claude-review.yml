name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude PR Review
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            
            const diff = execSync('git diff origin/${{ github.base_ref }}...HEAD').toString();
            fs.writeFileSync('/tmp/pr_diff.txt', diff.substring(0, 15000));
            
            // Install Python deps and run review
            const review = execSync(
              `python3 -c "
import urllib.request, json, os, sys

diff = open('/tmp/pr_diff.txt').read()
api_key = os.environ.get('ANTHROPIC_API_KEY', '')
if not api_key:
    print('ANTHROPIC_API_KEY not set')
    sys.exit(1)

pr_number = '${{ github.event.number }}'
owner = '${{ github.repository_owner }}'
repo = '${{ github.event.repository.name }}'

prompt = f'Review this PR diff and produce a structured Markdown review:\\n\\n\\\`\\\`\\\`diff\\n{diff[:10000]}\\n\\\`\\\`\\\`'

req = urllib.request.Request(
    'https://api.anthropic.com/v1/messages',
    data=json.dumps({
        'model': 'claude-sonnet-4-20250514',
        'max_tokens': 4096,
        'messages': [{'role': 'user', 'content': prompt}]
    }).encode(),
    headers={
        'Content-Type': 'application/json',
        'x-api-key': api_key,
        'anthropic-version': '2023-06-01'
    }
)
result = json.loads(urllib.request.urlopen(req).read().decode())
review = result['content'][0]['text']
print(review)
              "`
            ).toString();
            
            // Post review as comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Claude PR Review\n\n${review}`
            });
